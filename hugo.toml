description = "Edgar Vigueras: Java, sistemas financieros y arquitectura backend. Proyectos personales, IA aplicada, Linux, automatización, diseño y cosas que voy aprendiendo."

[params.profileMode]
enabled = true

title = "Edgar Vigueras"

subtitle = """
Java • Sistemas financieros • Arquitectura backend

Soy ingeniero de software con más de 15 años desarrollando sistemas Java para entornos financieros de misión crítica: trading electrónico, market data e integración de sistemas.

Coordino proyectos y equipos, y sigo disfrutando programar. Me interesan las soluciones simples, el desarrollo seguro y la automatización; actualmente exploro cómo aplicar agentes de IA al trabajo de ingeniería con criterio técnico y supervisión humana.

También construyo proyectos personales: software para una papelería familiar, experimentos con Linux e IA y el diseño de una jardinera con agua. Disfruto Dwarf Fortress, la ciencia ficción, la vida en el campo y aprender cómo funcionan las cosas.
"""

